<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flora Engine - Interaktive Python API</title>
<style>
  body { margin: 0; background: #0f172a; color: white; font-family: monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
  #ui { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.88); padding: 20px; border-radius: 8px; border: 1px solid #334155; width: 320px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  h2 { margin: 0 0 10px; font-size: 16px; color: #10b981; }
  button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
  button:hover { background: #1d4ed8; }
  .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
  #status { font-size: 11px; color: #fbbf24; margin-top: 10px; line-height: 1.4; }
  #prune-help { font-size: 11px; color: #94a3b8; background: rgba(30, 41, 59, 0.6); padding: 8px; border-radius: 4px; border-left: 3px solid #ef4444; margin-top: 10px; }
  #greenhouse { border-top: 1px dashed #475569; padding-top: 15px; margin-top: 15px; }
  .slot { font-size: 11px; padding: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; margin-bottom: 8px; border: 1px solid #1e293b; cursor:pointer;}
  .slot.selected { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
  #debug-panel { position: absolute; top: 20px; right: 20px; background: rgba(15,23,42,0.92); padding: 14px; border-radius: 8px; border: 1px solid #334155; width: 360px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-size: 11px; line-height: 1.5; }
  #debug-panel h3 { margin: 0 0 8px; font-size: 12px; color: #38bdf8; letter-spacing: 0.04em; text-transform: uppercase; }
  #debug-panel h4 { margin: 12px 0 6px; font-size: 11px; color: #fbbf24; }
  .dbg-meta { color: #94a3b8; margin-bottom: 8px; }
  .dbg-strand { font-family: monospace; background: rgba(0,0,0,0.35); padding: 4px 6px; border-radius: 4px; margin-bottom: 4px; border-left: 3px solid #10b981; word-break: break-all; }
  .dbg-trait { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(51,65,85,0.5); }
  .dbg-trait b { color: #e2e8f0; }
  .dbg-trait span { color: #38bdf8; }
  .dbg-pool { color: #64748b; font-size: 10px; }
</style>
</head>
<body>
<canvas id="iso-canvas"></canvas>
<div id="ui">
  <h2>Flora Python-Backend (Iso)</h2>
  <div class="btn-row">
      <button id="btn-grow10">Wachsen +10</button>
      <button id="btn-grow-season" style="background:#10b981;">+30 Steps</button>
  </div>
  <button id="btn-reset" style="background:#475569">Zufälliger Genotyp</button>
  
  <div id="prune-help">
      ✂️ <b>Gartenschere:</b> Klicke auf einen Ast, um ihn abzuschneiden. Aus der Schnittstelle treiben neue Knospen aus!
  </div>
  <div style="display:flex; gap:8px; margin-top:10px;">
      <button id="btn-pot" style="background:#a16207; flex:1; font-size:11px; padding:8px;">🪴 Topf</button>
      <button id="btn-schale" style="background:#44403c; flex:1; font-size:11px; padding:8px; opacity:0.6;">🥣 Schale</button>
  </div>

  <div id="greenhouse">
      <h3 style="margin: 0 0 10px; font-size: 13px;">Samenbank</h3>
      <button id="btn-save" style="background:#8b5cf6">Aktuellen Samen speichern</button>
      <div id="slots-container"></div>
      <button id="btn-breed" style="background:#ec4899; display:none; margin-top:10px;">🧬 Kreuzen!</button>
  </div>
  <div id="status">Warte auf Berechnungen...</div>
</div>
<div id="debug-panel">
  <h3>🧬 Genom-Debug — alle Genwerte</h3>
  <div id="dbg-meta" class="dbg-meta">Lade...</div>
  <h4>Stränge (polyploid)</h4>
  <div id="dbg-strands"></div>
  <h4>Merkmale nach botanical_schema.json</h4>
  <div id="dbg-traits"></div>
  <div id="dbg-pool" class="dbg-pool" style="margin-top:8px;"></div>
</div>

<script>
  let plantNodes = [];
  let hoveredNode = null;
  let hoveredPoint = null;
  
  const canvas = document.getElementById('iso-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, scale = 1.0, offsetX = 0, offsetY = 0;
  
  function randomPolyploid() {
      const gS = () => Array.from({length: 10}, () => Math.floor(Math.random()*4));
      return [gS(), gS(), gS()];
  }

  let currentSteps = 0;
  let currentSeed = Math.floor(Math.random()*1000000);
  let currentStrands = randomPolyploid();
  let greenhouse = [];
  let selectedSlots = [];

  function toIso(x, y, z) {
      const isoX = (x - y) * 0.866025; 
      const isoY = (x + y) * 0.5 - z;
      return { x: offsetX + isoX * scale, y: offsetY + isoY * scale };
  }

  // Topf/Schale — isometrischer Pflanzkübel unterm Spross
  // Passt sich leicht dem Habitus an (wird im Debug schon dekodiert), default: schöner Terrakotta-Topf
  let potStyle = 'topf'; // 'topf' | 'schale'
  function drawPot() {
      const topCenter = toIso(0, 0, 0);
      // Maße skalieren mit Zoom, aber clampen damit Topf nie winzig/riesig wird
      const s = Math.max(0.6, Math.min(1.6, scale));
      const isSchale = potStyle === 'schale';
      const topRx = (isSchale ? 32 : 24) * s;
      const topRy = (isSchale ? 14 : 11) * s;
      const botRx = (isSchale ? 28 : 18) * s;
      const botRy = (isSchale ? 12 : 8) * s;
      const h = (isSchale ? 14 : 22) * s;
      const botCenter = { x: topCenter.x, y: topCenter.y + h };

      // Schatten auf dem Boden
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath();
      ctx.ellipse(botCenter.x, botCenter.y + 4, botRx + 6, botRy + 3, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      // Seitenwand — vordere Hälfte des Topfs
      const leftTopX = topCenter.x - topRx;
      const rightTopX = topCenter.x + topRx;
      const leftBotX = botCenter.x - botRx;
      const rightBotX = botCenter.x + botRx;
      // Körper
      ctx.fillStyle = isSchale ? '#9a7b5a' : '#b45a3c'; // Schale: heller Ton, Topf: Terrakotta
      ctx.beginPath();
      ctx.moveTo(leftTopX, topCenter.y);
      ctx.lineTo(leftBotX, botCenter.y);
      // bottom ellipse front half
      ctx.ellipse(botCenter.x, botCenter.y, botRx, botRy, 0, Math.PI, 0, false);
      ctx.lineTo(rightTopX, topCenter.y);
      // top ellipse front half (nach innen)
      ctx.ellipse(topCenter.x, topCenter.y, topRx, topRy, 0, 0, Math.PI, false);
      ctx.closePath();
      ctx.fill();
      // Lichtkante links
      ctx.fillStyle = isSchale ? '#c4a484' : '#d67a5a';
      ctx.beginPath();
      ctx.moveTo(leftTopX, topCenter.y);
      ctx.lineTo(leftBotX, botCenter.y);
      ctx.ellipse(botCenter.x, botCenter.y, botRx, botRy, 0, Math.PI, Math.PI*1.35, false);
      ctx.lineTo(topCenter.x - topRx*0.35, topCenter.y + topRy*0.3);
      ctx.ellipse(topCenter.x, topCenter.y, topRx, topRy, 0, Math.PI, Math.PI*1.35, false);
      ctx.closePath();
      ctx.fill();
      // Schatten rechts
      ctx.fillStyle = isSchale ? '#6b4f3a' : '#7a2e16';
      ctx.beginPath();
      ctx.moveTo(rightTopX, topCenter.y);
      ctx.lineTo(rightBotX, botCenter.y);
      ctx.ellipse(botCenter.x, botCenter.y, botRx, botRy, 0, Math.PI*1.65, Math.PI*2, false);
      ctx.lineTo(topCenter.x + topRx*0.35, topCenter.y + topRy*0.3);
      ctx.ellipse(topCenter.x, topCenter.y, topRx, topRy, 0, Math.PI*1.65, Math.PI*2, false);
      ctx.closePath();
      ctx.fill();

      // Topf-Rand (Wulst)
      ctx.fillStyle = isSchale ? '#b8936f' : '#c96a45';
      ctx.beginPath();
      ctx.ellipse(topCenter.x, topCenter.y, topRx + 3, topRy + 2.5, 0, 0, Math.PI*2);
      ctx.fill();
      // Rand-Innen
      ctx.fillStyle = isSchale ? '#a67c52' : '#8a3a1f';
      ctx.beginPath();
      ctx.ellipse(topCenter.x, topCenter.y, topRx - 1, topRy - 1, 0, 0, Math.PI*2);
      ctx.fill();
      // Erde
      ctx.fillStyle = '#3a2a1a';
      ctx.beginPath();
      ctx.ellipse(topCenter.x, topCenter.y, topRx - 4, topRy - 2.5, 0, 0, Math.PI*2);
      ctx.fill();
      // kleiner Erd-Glanz
      ctx.fillStyle = 'rgba(92,64,32,0.7)';
      ctx.beginPath();
      ctx.ellipse(topCenter.x - topRx*0.25, topCenter.y - topRy*0.15, topRx*0.3, topRy*0.25, 0, 0, Math.PI*2);
      ctx.fill();
  }

  function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const l2 = dx * dx + dy * dy;
      if (l2 < 1e-6) {
          return { dist: Math.hypot(px - x1, py - y1), cx: x1, cy: y1 };
      }
      let t = ((px - x1) * dx + (py - y1) * dy) / l2;
      t = Math.max(0, Math.min(1, t));
      const cx = x1 + t * dx;
      const cy = y1 + t * dy;
      return { dist: Math.hypot(px - cx, py - cy), cx, cy };
  }

  function findClosestStemNode(screenX, screenY, maxDist = 25) {
      let closestNode = null;
      let minDist = maxDist;
      let closestPt = null;
      
      for (const n of plantNodes) {
          if (n.type !== 'stem' && n.type !== 'floral_axis') continue;
          if (!n.currentLength || n.currentLength <= 0.01) continue;
          
          const p1 = toIso(n.pos.x, n.pos.y, n.pos.z);
          const p2 = toIso(
              n.pos.x + n.dir.x * n.currentLength,
              n.pos.y + n.dir.y * n.currentLength,
              n.pos.z + n.dir.z * n.currentLength
          );
          
          const res = pointToSegmentDistance(screenX, screenY, p1.x, p1.y, p2.x, p2.y);
          if (res.dist < minDist) {
              minDist = res.dist;
              closestNode = n;
              closestPt = res;
          }
      }
      return closestNode ? { node: closestNode, dist: minDist, point: closestPt } : null;
  }

  function renderCanvas() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.beginPath();
      for(let i=-20; i<=20; i+=2) {
          const p1 = toIso(i*40, -800, 0); const p2 = toIso(i*40, 800, 0);
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
          const p3 = toIso(-800, i*40, 0); const p4 = toIso(800, i*40, 0);
          ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
      }
      ctx.stroke();

      drawPot();

      plantNodes.sort((a,b) => (b.pos.x + b.pos.y) - (a.pos.x + a.pos.y));
      plantNodes.forEach(n => {
          const p1 = toIso(n.pos.x, n.pos.y, n.pos.z);
          if (n.type === 'stem' || n.type === 'floral_axis') {
              const p2 = toIso(n.pos.x + n.dir.x * n.currentLength, n.pos.y + n.dir.y * n.currentLength, n.pos.z + n.dir.z * n.currentLength);
              const wood = Math.min(1.0, (n.age||0)/120);
              const isHovered = (hoveredNode && hoveredNode.id === n.id);
              
              if (isHovered) {
                  ctx.strokeStyle = '#ef4444'; // Highlight cut branch in bright red
                  ctx.lineWidth = 4;
              } else if (n.type === 'floral_axis') {
                  ctx.strokeStyle = 'rgba(34, 197, 94, 0.9)'; // pure green thin stalks
                  ctx.lineWidth = 1.5;
              } else {
                  ctx.strokeStyle = 'rgb('+(45*(1-wood)+120*wood)+','+(140*(1-wood)+80*wood)+','+(70*(1-wood)+40*wood)+')'; 
                  ctx.lineWidth = Math.max(1, 4 * wood); // Filigranere Dicke
              }
              
              // Smooth joints (keine harten Kanten mehr an den Segmentübergängen)
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              
              ctx.beginPath(); 
              ctx.moveTo(p1.x, p1.y); 
              
              // Wir nutzen die echte 3D-Biegung (Euler-Bernoulli) der Python-Engine!
              // Der 2D-Fake mit quadraticCurveTo hat die Tangenten der Segmente zerstört.
              ctx.lineTo(p2.x, p2.y); 
              ctx.stroke();
          } else {
              const p2 = toIso(
                  n.pos.x + n.dir.x * (n.currentLength || 0),
                  n.pos.y + n.dir.y * (n.currentLength || 0),
                  n.pos.z + n.dir.z * (n.currentLength || 0)
              );
              
              // Draw the pedicel (stalk) to connect the flower/leaf to the branch
              if (n.currentLength > 0.01) {
                  ctx.strokeStyle = 'rgba(34, 197, 94, 0.7)';
                  ctx.lineWidth = 1;
                  ctx.lineCap = 'round';
                  ctx.lineJoin = 'round';
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.stroke();
              }
              
              ctx.save();
              ctx.translate(p2.x, p2.y);
              ctx.scale(n.defX || 1, n.defY || 1);
              if (n.type === 'flower') {
                  let r = 255 + (n.colR||0), g = 255 + (n.colG||0), b = 255 + (n.colB||0);
                  let r2 = 255 + (n.colR2 ?? n.colR ?? 0), g2 = 255 + (n.colG2 ?? n.colG ?? 0), b2 = 255 + (n.colB2 ?? n.colB ?? 0);
                  
                  let p = n.petals || 5;
                  
                  // Base radius (no double scaling, ctx.scale already handles it)
                  let base_outer = 8; 
                  let base_inner = 3;
                  
                  // Radial Gradient for Saftmale (Nectar Guides)
                  let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, base_outer);
                  grad.addColorStop(0, `rgb(${r2},${g2},${b2})`); // Center color (Saftmal)
                  grad.addColorStop(1, `rgb(${r},${g},${b})`);    // Edge color
                  ctx.fillStyle = grad;
                  
                  ctx.beginPath();
                  for (let j=0; j<p*2; j++) {
                      let r_point = j%2===0 ? base_outer : base_inner;
                      let ang = (j * Math.PI) / p;
                      ctx.lineTo(Math.cos(ang)*r_point, Math.sin(ang)*r_point);
                  }
                  ctx.closePath();
              } else {
                  ctx.fillStyle = 'rgba(34, 197, 94, 0.8)';
                  ctx.beginPath();
                  ctx.arc(0, 0, 4, 0, Math.PI*2); // ctx.scale already scales this!
              }
              ctx.fill();
              ctx.restore();
          }
      });

      // Draw scissors marker if hovering near a cut point
      if (hoveredNode && hoveredPoint) {
          ctx.save();
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(hoveredPoint.cx, hoveredPoint.cy, 4, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.font = '14px sans-serif';
          ctx.fillText('✂️', hoveredPoint.cx + 6, hoveredPoint.cy - 6);
          ctx.restore();
      }
  }

  function resize() {
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width; canvas.height = height;
      offsetX = width / 2; offsetY = height - 100;
      renderCanvas();
  }
  window.addEventListener('resize', resize);
  
  let isMouseDown = false;
  let lastX = 0, lastY = 0;
  let dragDist = 0;

  canvas.addEventListener('mousedown', e => {
      isMouseDown = true;
      lastX = e.clientX;
      lastY = e.clientY;
      dragDist = 0;
  });

  window.addEventListener('mouseup', async e => {
      if (!isMouseDown) return;
      isMouseDown = false;
      
      // If user clicked without dragging, perform pruning!
      if (dragDist < 6) {
          const rect = canvas.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;
          const target = findClosestStemNode(mouseX, mouseY, 25);
          if (target && target.node) {
              await pruneBranch(target.node.id);
          }
      }
  });

  window.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      
      if (isMouseDown) {
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          dragDist += Math.hypot(dx, dy);
          offsetX += dx;
          offsetY += dy;
          lastX = e.clientX;
          lastY = e.clientY;
          renderCanvas();
      } else {
          const target = findClosestStemNode(mouseX, mouseY, 25);
          const newHoverNode = target ? target.node : null;
          const newHoverPoint = target ? target.point : null;
          
          if ((hoveredNode ? hoveredNode.id : null) !== (newHoverNode ? newHoverNode.id : null)) {
              hoveredNode = newHoverNode;
              hoveredPoint = newHoverPoint;
              canvas.style.cursor = hoveredNode ? 'pointer' : 'default';
              renderCanvas();
          }
      }
  });

  canvas.addEventListener('wheel', e => { e.preventDefault(); scale *= e.deltaY > 0 ? 0.9 : 1.1; renderCanvas(); });

  async function pruneBranch(nodeId) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = `✂️ Ast #${nodeId} wird abgeschnitten...`;
      try {
          const res = await fetch('/api/prune', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ node_id: nodeId })
          });
          const data = await res.json();
          if (data.nodes) {
              plantNodes = data.nodes;
          }
          if(data.debug) renderDebug(data.debug);
          hoveredNode = null;
          hoveredPoint = null;
          canvas.style.cursor = 'default';
          statusEl.innerText = `✂️ Ast #${nodeId} gestutzt (${data.killed_count || 0} Nachfolger entfernt). Schnittstelle ist nun schlafende Knospe.`;
          renderCanvas();
      } catch (err) {
          statusEl.innerText = 'Pruning Fehler: ' + err.message;
      }
  }

  async function simulateGrowth(steps = 10, isReset = false) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = isReset ? 'Initialisiere Genom in Python...' : `Wachstum (+${steps} Steps)...`;
      try {
          const res = await fetch('/api/simulate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ steps: steps, seed: currentSeed, strands: currentStrands, reset: isReset })
          });
          const data = await res.json();
          plantNodes = data.nodes;
          if(data.strands) currentStrands = data.strands;
          if(data.debug) renderDebug(data.debug); else renderDebug(buildClientDebug(currentStrands));
          currentSteps = data.step !== undefined ? data.step : (isReset ? steps : currentSteps + steps);
          statusEl.innerText = `[Step ${currentSteps}] ${plantNodes.length} Knoten aktiv.`;
          
          if (isReset && plantNodes.length > 0) {
              let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
              plantNodes.forEach(n => {
                  const p = toIso(n.pos.x, n.pos.y, n.pos.z);
                  minX = Math.min(minX, p.x - offsetX); maxX = Math.max(maxX, p.x - offsetX);
                  minY = Math.min(minY, p.y - offsetY); maxY = Math.max(maxY, p.y - offsetY);
              });
              offsetX = width/2 - (minX + maxX)/2;
              offsetY = height/2 - (minY + maxY)/2;
          }
          renderCanvas();
      } catch (err) {
          statusEl.innerText = 'Python Server Fehler: ' + err.message;
      }
  }

  document.getElementById('btn-grow10').onclick = () => { simulateGrowth(10, false); };
  document.getElementById('btn-grow-season').onclick = () => { simulateGrowth(30, false); };
  document.getElementById('btn-reset').onclick = () => {
      currentSeed = Math.floor(Math.random()*1000000);
      currentStrands = randomPolyploid();
      renderDebug(buildClientDebug(currentStrands));
      currentSteps = 0;
      simulateGrowth(15, true);
  };
  function updatePotButtons(){
      const bTopf = document.getElementById('btn-pot');
      const bSchale = document.getElementById('btn-schale');
      if(potStyle==='topf'){ bTopf.style.opacity='1'; bTopf.style.border='1px solid #fbbf24'; bSchale.style.opacity='0.6'; bSchale.style.border='none'; }
      else { bSchale.style.opacity='1'; bSchale.style.border='1px solid #fbbf24'; bTopf.style.opacity='0.6'; bTopf.style.border='none'; }
  }
  document.getElementById('btn-pot').onclick = () => { potStyle='topf'; window._potManuallyChosen=true; updatePotButtons(); renderCanvas(); };
  document.getElementById('btn-schale').onclick = () => { potStyle='schale'; window._potManuallyChosen=true; updatePotButtons(); renderCanvas(); };
  updatePotButtons();
  
  function renderGreenhouse() {
      const slots = document.getElementById('slots-container');
      if (greenhouse.length === 0) return slots.innerHTML = '<div style="font-size:11px; color:#64748b;">Leer.</div>';
      slots.innerHTML = greenhouse.map((g, i) => {
          const sel = selectedSlots.includes(i) ? 'selected' : '';
          return '<div class="slot '+sel+'" onclick="window.toggleSlot('+i+')">Samen '+(i+1)+' (Python Genom)</div>';
      }).join('');
      document.getElementById('btn-breed').style.display = selectedSlots.length === 2 ? 'block' : 'none';
  }
  window.toggleSlot = function(idx) {
      const i = selectedSlots.indexOf(idx);
      if (i > -1) selectedSlots.splice(i, 1);
      else { if (selectedSlots.length >= 2) selectedSlots.shift(); selectedSlots.push(idx); }
      renderGreenhouse();
  };
  document.getElementById('btn-save').onclick = () => { greenhouse.push(JSON.parse(JSON.stringify(currentStrands))); renderGreenhouse(); };
  
  document.getElementById('btn-breed').onclick = async () => {
      if(selectedSlots.length === 2) {
          const statusEl = document.getElementById('status');
          statusEl.innerText = 'Berechne Meiose in Python...';
          const res = await fetch('/api/breed', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ g1: greenhouse[selectedSlots[0]], g2: greenhouse[selectedSlots[1]], seed: Math.floor(Math.random()*1000000) })
          });
          const data = await res.json();
          currentStrands = data.strands;
          renderDebug(buildClientDebug(currentStrands));
          currentSeed = Math.floor(Math.random()*1000000);
          selectedSlots = [];
          renderGreenhouse();
          simulateGrowth(15, true);
      }
  };

  const BOTANICAL_SCHEMA = {
    habitus: { wuchsform: ["aufrecht","kriechend","kletternd","hängend","polsterförmig","rosettenbildend"], lebensform: ["annuell","bienne","perenn","gehölz","kraut"] },
    sprossachse: { querschnitt: ["rund","vierkantig","gefurcht","gerieft"], oberflaeche: ["glatt","behaart","stachelig","bereift"] },
    blaetter: { stellung: ["wechselständig","gegenständig","quirlständig"], form: ["eiförmig","lanzettlich","herzförmig","spatelförmig","fiederspaltig"], rand: ["ganzrandig","gezähnt","gesägt","gelappt"] },
    blueten: { bluetenstand: ["traube","aehre","rispe","dolde","koepfchen","einzelbluete"], symmetrie: ["radiaersymmetrisch","zygomorph","asymmetrisch"] }
  };
  const LOCUS_LABELS = ["habitus.wuchsform","habitus.lebensform","sprossachse.querschnitt","sprossachse.oberflaeche","blaetter.stellung","blaetter.form","blaetter.rand","blueten.bluetenstand","blueten.symmetrie","farbe/symmetrie-mod"];

  function buildClientDebug(strands){
    const maxLen = Math.max(...strands.map(s=>s.length), 0);
    const pool = {};
    for(let l=0;l<maxLen;l++) pool[l]=[];
    strands.forEach(s=> s.forEach((a,l)=> pool[l].push(a)));
    Object.keys(pool).forEach(k=> pool[k].sort((a,b)=>a-b));
    const traits=[];
    for(let l=0;l<LOCUS_LABELS.length;l++){
      const alleles = pool[l]||[0];
      const label = LOCUS_LABELS[l];
      let decoded='';
      if(l===0) decoded = BOTANICAL_SCHEMA.habitus.wuchsform[(alleles[0]||0)%6];
      else if(l===1) decoded = BOTANICAL_SCHEMA.habitus.lebensform[(alleles[0]||0)%5];
      else if(l===2) decoded = BOTANICAL_SCHEMA.sprossachse.querschnitt[(alleles[0]||0)%4];
      else if(l===3) decoded = BOTANICAL_SCHEMA.sprossachse.oberflaeche[(alleles[0]||0)%4];
      else if(l===4) decoded = BOTANICAL_SCHEMA.blaetter.stellung[(alleles[0]||0)%3];
      else if(l===5) decoded = BOTANICAL_SCHEMA.blaetter.form[(alleles[0]||0)%5];
      else if(l===6) decoded = BOTANICAL_SCHEMA.blaetter.rand[(alleles[0]||0)%4];
      else if(l===7) decoded = BOTANICAL_SCHEMA.blueten.bluetenstand[(alleles[0]||0)%6];
      else if(l===8) decoded = BOTANICAL_SCHEMA.blueten.symmetrie[(alleles[0]||0)%3];
      else decoded = `alleles=${alleles.join(',')}`;
      traits.push({locus:l, label, alleles, decoded});
    }
    return {strands, ploidy: strands.length, pool, traits};
  }

  function renderDebug(debug){
    if(!debug) { debug = buildClientDebug(currentStrands); }
    const meta = document.getElementById('dbg-meta');
    const sEl = document.getElementById('dbg-strands');
    const tEl = document.getElementById('dbg-traits');
    const pEl = document.getElementById('dbg-pool');
    meta.innerText = `Ploidie: ${debug.ploidy}×  |  Loci: ${Object.keys(debug.pool||{}).length}  |  Seed: ${currentSeed}`;
    sEl.innerHTML = (debug.strands||[]).map((s,i)=> `<div class="dbg-strand">Strang ${i+1}: [${s.join(', ')}]</div>`).join('');
    tEl.innerHTML = (debug.traits||[]).map(t=> `<div class="dbg-trait"><b>${t.locus}: ${t.label}</b><span>${t.decoded} <span class="dbg-pool">[${(t.alleles||[]).join(',')}]</span></span></div>`).join('');
    pEl.innerText = `Pool (sortiert je Locus): ${JSON.stringify(debug.pool)}`;
    // Habitus-Kopplung: Wuchsform steuert Topf/Schale automatisch
    const wuchs = (debug.traits && debug.traits[0] && debug.traits[0].decoded) || '';
    const schaleFormen = ['polsterförmig','rosettenbildend','kriechend','hängend'];
    const autoStyle = schaleFormen.includes(wuchs) ? 'schale' : 'topf';
    if(potStyle !== autoStyle){
        potStyle = autoStyle;
        if(typeof updatePotButtons === 'function') updatePotButtons();
    }
  }

  // initial render before server reply
  renderDebug(null);

  resize();
  simulateGrowth(15, true);
</script>
</body>
